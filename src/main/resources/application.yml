server:
  address: ${HOST:127.0.0.1}
  port: ${PORT:8080}
spring:
  application:
    name: bankflow-ai-enterprise
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bankflow}
    username: ${DB_USER:bankflow}
    password: ${DB_PASSWORD:local-db-only}
    hikari:
      maximum-pool-size: 6
  flyway:
    enabled: true
  jackson:
    serialization:
      write-dates-as-timestamps: false
app:
  ai:
    mode: ${AI_MODE:mock}
    embedding-mode: ${EMBEDDING_MODE:mock}
    aws-region: ${AWS_REGION:us-east-1}
    bedrock-model-id: ${BEDROCK_MODEL_ID:amazon.nova-lite-v1:0}
    embedding-model-id: ${EMBEDDING_MODEL_ID:amazon.titan-embed-text-v2:0}
  core:
    mode: ${CORE_MODE:mock}
    url: ${CORE_URL:http://localhost:8090}
    api-key: ${CORE_API_KEY:demo-core-key}
  review:
    username: ${REVIEW_USERNAME:reviewer}
    password: ${REVIEW_PASSWORD:local-demo-only}
  workflow:
    max-steps: 12
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: never
---
spring:
  config:
    activate:
      on-profile: prod
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI}
